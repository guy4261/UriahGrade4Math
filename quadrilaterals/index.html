<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>מרובעים | מעבדת החשבון</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="compact-game" data-geometry="quadrilaterals">
    <main>
      <a class="back" href="../">→ לכל המשחקים</a>
      <div class="game-heading">
        <h1>מרובעים</h1>
        <div class="round-controls">
          <button class="secondary" id="open-pdf">יצירת PDF ↓</button
          ><button class="secondary" id="next-shape">ציור חדש ↻</button>
        </div>
      </div>
      <p id="geometry-instruction"></p>
      <div class="geometry-workspace">
        <div class="geometry-drawing">
          <svg
            id="shape"
            viewBox="0 0 500 380"
            role="img"
            aria-label="ציור לזיהוי"
          ></svg>
        </div>
        <div>
          <h2>מה מצויר?</h2>
          <div id="shape-options" class="shape-options"></div>
          <button
            id="shape-feedback"
            type="button"
            disabled
            aria-live="polite"
          ></button>
        </div>
      </div>
    </main>
    <dialog id="geometry-pdf-dialog">
      <form id="geometry-pdf-form">
        <h2>דף תרגילים להדפסה</h2>
        <label for="geometry-pdf-count">מספר התרגילים</label
        ><input
          id="geometry-pdf-count"
          type="number"
          min="1"
          step="1"
          value="6"
          required
        />
        <div class="answer-actions">
          <button class="primary" id="geometry-pdf-generate" type="submit">
            יצירה והורדה</button
          ><button class="secondary" id="geometry-pdf-close" type="button">
            ביטול
          </button>
        </div>
        <p id="geometry-pdf-status" role="status"></p>
      </form>
    </dialog>
    <script src="../exercises/pdf.js"></script>
    <script src="../geometry.js"></script>
    <script src="../geometry-pdf.js"></script>
  </body>
</html>
